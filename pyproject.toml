[project]
name = "kit-cycle"
version = "0.2.0"
description = "The Kit: plan and build any Product with agents, one Cycle at a time."
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
kit = "kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]
artifacts = ["src/kit/template/**", "src/kit/plugin/**", "src/kit/sandbox/**"]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.380", "ruff>=0.6"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
